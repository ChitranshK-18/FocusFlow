<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    FocusFlow Settings
  </title>

  <link
    rel="stylesheet"
    href="settings.css"
  >

</head>


<body>


  <main
    class="settings-container"
  >


    <!-- HEADER -->

    <header
      class="settings-header"
    >

      <button
        id="backBtn"
        class="back-btn"
      >

        ←

      </button>


      <div>

        <p>
          FOCUSFLOW
        </p>

        <h1>
          Settings
        </h1>

      </div>

    </header>


    <!-- PRODUCTIVE -->

    <section
      class="settings-card"
    >

      <h2>
        Productive Websites
      </h2>


      <p>
        These websites increase
        your productivity score.
      </p>


      <div
        id="productiveList"
        class="site-list"
      ></div>


      <div
        class="add-site"
      >

        <input
          id="productiveInput"
          type="text"
          placeholder="example.com"
        >


        <button
          id="addProductiveBtn"
        >

          Add

        </button>

      </div>

    </section>


    <!-- DISTRACTING -->

    <section
      class="settings-card"
    >

      <h2>
        Distracting Websites
      </h2>


      <p>
        These websites reduce
        your productivity score.
      </p>


      <div
        id="distractingList"
        class="site-list"
      ></div>


      <div
        class="add-site"
      >

        <input
          id="distractingInput"
          type="text"
          placeholder="example.com"
        >


        <button
          id="addDistractingBtn"
        >

          Add

        </button>

      </div>

    </section>


    <!-- RESET -->

    <section
      class="danger-section"
    >

      <h2>
        Reset Activity
      </h2>


      <p>
        Clear today's tracked
        browsing data.
      </p>


      <button
        id="resetBtn"
        class="reset-btn"
      >

        Reset Today's Data

      </button>

    </section>


  </main>


  <script
    src="settings.js"
  ></script>


</body>

</html>
